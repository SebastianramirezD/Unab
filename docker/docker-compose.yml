# docker/docker-compose.yml
# Levanta los tres servicios: backend (FastAPI), frontend (React) y Nginx como proxy
version: "3.9"

services:

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: spam_backend
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../datasets/processed:/app/datasets/processed
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: spam_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    restart: unless-stopped

networks:
  default:
    name: spam_net
